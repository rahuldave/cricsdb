name: Documentation site

# Builds the docs site with smalldocs on every pull request, and on a push to
# main also publishes it to GitHub Pages at https://rahuldave.com/cricsdb/.
# The site has three references. smalldocs writes the front-end one with TypeDoc,
# the HTTP one from the OpenAPI document of the FastAPI app, and the backend one
# by importing the Python package `api`. The last two import the backend, so the
# job installs the project's Python packages. No database is needed. Importing the
# app opens none; the `setup` function adds the routers, and the database opens
# only when the server starts.

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: documentation-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # TypeDoc reads the front end's types, so it needs its packages.
      - name: Install the front end's packages
        # npm 10 needs @emnapi/core and @emnapi/runtime in the lockfile; npm 11 drops them on install. Keep them.
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      # The HTTP and backend references import the backend, and so does the render,
      # which reads the backend reference. So smalldocs runs in the project's
      # environment, from uv.lock, with no change to the lockfile.
      - name: Install the backend's packages
        run: uv sync --frozen
      - name: Write the references
        run: uv run --frozen --with smalldocs==0.5.10 smalldocs api build --dir docs
      - name: Render the site
        run: uv run --frozen --with smalldocs==0.5.10 smalldocs render docs --strict
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    name: Publish documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
